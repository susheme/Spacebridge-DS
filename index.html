<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spacebridge UI — Design System</title>
<!-- Theme: читаем из localStorage ДО первого paint, чтобы не было flash -->
<script>(function(){var t=localStorage.getItem('sb-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>

<!-- Color tokens — редактируются в js/tokens.js -->
<script src="js/tokens.js"></script>

<!-- Roboto больше НЕ с CDN — локальные woff2 в fonts/, @font-face в css/tokens.css.
     Без сети CDN-фолбэк уходил в Helvetica и синтезировал faux-bold 600. -->

<!-- Base styles -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/typography.css">
<link rel="stylesheet" href="css/playground.css">
<link rel="stylesheet" href="css/docs.css">
<link rel="stylesheet" href="css/animations.css">

<!-- Component styles (порядок не важен для CSS — scope по классам) -->
<link rel="stylesheet" href="css/components/grid-system.css">
<link rel="stylesheet" href="css/components/buttons.css">
<link rel="stylesheet" href="css/components/chips.css">
<link rel="stylesheet" href="css/components/action-bar.css">
<link rel="stylesheet" href="css/components/chevron.css">
<link rel="stylesheet" href="css/components/separator.css">
<link rel="stylesheet" href="css/components/avatar.css">
<link rel="stylesheet" href="css/components/toggles.css">
<link rel="stylesheet" href="css/components/checkbox.css">
<link rel="stylesheet" href="css/components/radio.css">
<link rel="stylesheet" href="css/components/counter.css">
<link rel="stylesheet" href="css/components/kbd.css">
<link rel="stylesheet" href="css/components/search-bar.css">
<link rel="stylesheet" href="css/components/input.css">
<link rel="stylesheet" href="css/components/file-uploader.css">
<link rel="stylesheet" href="css/components/overlay.css">
<link rel="stylesheet" href="css/components/popover.css">
<link rel="stylesheet" href="css/components/dialogues.css">
<link rel="stylesheet" href="css/components/textarea.css">
<link rel="stylesheet" href="css/components/password.css">
<link rel="stylesheet" href="css/components/selector.css">
<link rel="stylesheet" href="css/components/tags.css">
<link rel="stylesheet" href="css/components/tooltips.css">
<link rel="stylesheet" href="css/components/status.css">
<link rel="stylesheet" href="css/components/info-footer.css">
<link rel="stylesheet" href="css/components/badge.css">
<link rel="stylesheet" href="css/components/pin.css">
<link rel="stylesheet" href="css/components/banners.css">
<link rel="stylesheet" href="css/components/snackbar.css">
<link rel="stylesheet" href="css/components/table.css">
<link rel="stylesheet" href="css/components/list.css">
<link rel="stylesheet" href="css/components/context-menu.css">
<link rel="stylesheet" href="css/components/segment-menu.css">
<link rel="stylesheet" href="css/components/tabs.css">
<link rel="stylesheet" href="css/components/tab-bar.css">
<link rel="stylesheet" href="css/components/toc.css">
<link rel="stylesheet" href="css/components/breadcrumbs.css">
<link rel="stylesheet" href="css/components/pagination.css">
<link rel="stylesheet" href="css/components/table-footer.css">
<link rel="stylesheet" href="css/components/nav-bar.css">
<link rel="stylesheet" href="css/components/sub-nav.css">
<link rel="stylesheet" href="css/components/tool-bar.css">
<link rel="stylesheet" href="css/components/led-panel.css">
<link rel="stylesheet" href="css/components/section-header.css">
<link rel="stylesheet" href="css/components/header-xs.css">
<link rel="stylesheet" href="css/components/toast.css">
<link rel="stylesheet" href="css/components/header-s.css">
<link rel="stylesheet" href="css/components/header-m.css">
<link rel="stylesheet" href="css/components/header-l.css">

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>

<div class="app">
  <!-- TOPBAR — dogfood собственного Nav Bar компонента.
       Текущий вариант: текстовый brand-логотип (SPACEBRIDGE / SB).
       Чтобы вернуться к SVG-лого — содержимое .sb-nav-bar-logo-full /
       .sb-nav-bar-logo-compact span'ов замени на <svg>...</svg>.
       Компонент принимает любой HTML внутри этих слотов. -->
  <header class="sb-nav-bar" style="flex-shrink:0">
    <!-- Лого — привычный жест «домой»: клик ведёт на Getting Started (тот же
         пункт закреплён в шапке сайдбара). Роль и tabindex — чтобы жест был
         доступен и с клавиатуры, а не только мышью. -->
    <div class="sb-nav-bar-left" role="link" tabindex="0" title="Getting Started"
         aria-label="Getting Started" style="cursor:pointer"
         onclick="navigate('getting-started')"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();navigate('getting-started')}">
      <span class="sb-nav-bar-logo-full">
        <span class="sb-brand" style="font-size:18px;color:var(--primary)">SPACEBRIDGE</span>
      </span>
      <span class="sb-nav-bar-logo-compact">
        <span class="sb-brand" style="font-size:18px;color:var(--primary)">SB</span>
      </span>
      <span class="sb-nav-bar-logo-title sb-caption" style="color:var(--text-secondary)">| Design System</span>
      <span class="sb-nav-bar-badge"><span class="sb-badge-status mini bs-blue">v1.13.1</span></span>
    </div>
    <div class="sb-nav-bar-center"></div>
    <div class="sb-nav-bar-right" id="dsNavRight">
      <!-- Language switcher и Theme-кнопка инжектятся ниже по файлу через
           sbMkLangSwitcher / sbMkButton — разметку кнопок в DS руками не пишем. -->
    </div>
  </header>

  <div class="body">
    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar"></nav>

    <!-- CONTENT -->
    <main class="content" id="content"></main>
  </div>

  <!-- APP INFO FOOTER (dogfood: sbMkInfoFooter long) — заполняется ниже скриптом -->
  <div id="app-info-footer" style="flex-shrink:0"></div>
</div>

<!-- JS: порядок важен. См. js/_index.js -->
<script src="js/core.js"></script>
<script src="js/docs-helpers.js"></script>
<!-- docs-i18n — sbT/sbDocNote для двуязычных описаний. ДО components/*:
     хелперы вызываются в конфигах sbRegister на этапе загрузки. -->
<script src="js/docs-i18n.js"></script>

<!-- Components (порядок: сначала те, чей COMP_CSS-ключ используют другие —
     chevron и input перед selector/textarea/password) -->
<!-- chevron + badge + banners — ПЕРВАЯ ТРОЙКА, до всех остальных:
     sbDocNote (docs-i18n.js) собирает Tech Info/Important плашки через
     sbMkBanner при регистрации КАЖДОГО компонента ниже. banners при
     регистрации зовёт sbMkChevron (→ после chevron) и sbIcon с fill-иконками
     из SB_BADGE_SPECS (→ после badge); SB_SVG нужен только в рантайме
     плейграунда. Двое регистрируются ДО sbMkBanner — chevron и badge: их
     плашки идут через bootstrap-фолбэк sbDocNote (зеркало mkBanner, см. SYNC;
     фолбэк зовёт sbMkChevron — потому chevron строго первый).
     snackbar — сразу за тройкой: его секция зовёт sbDocNote (→ нужен
     sbMkBanner из banners), а лид success-fill берётся из SB_BADGE_SPECS.
     buttons вклинивается вторым, сразу за chevron: после миграции на фабрику
     sbMkButton его зовут при РЕГИСТРАЦИИ и badge (футер секции Symbol Badges),
     и snackbar (кнопки «Show Live»), а sbRegister трогает sections сразу —
     геттер тут не спасает. Плашки самого buttons идут через тот же
     bootstrap-фолбэк sbDocNote, что у chevron и badge. -->
<script src="js/components/chevron.js"></script>
<!-- grid-system — примитивы раскладки (Flex / Grid / Page). Третьим, сразу
     за chevron: демо-секции banners, snackbar и других зовут sbMkFlex прямо
     при регистрации. Своих зависимостей нет — адаптивность приходит из
     токенов, media-запросов внутри компонента ноль. -->
<script src="js/components/grid-system.js"></script>
<script src="js/components/buttons.js"></script>
<script src="js/components/badge.js"></script>
<script src="js/components/banners.js"></script>
<script src="js/components/snackbar.js"></script>
<!-- Базовые контролы идут первыми: их фабрики (sbMkCheckbox / sbMkToggle)
     зовут и другие компоненты в своих preview-шаблонах, и САМО ЯДРО из
     pg.toggle / pg.radio. Им из core нужен только SB_GLYPHS и boolAttr.
     toggles ОБЯЗАН быть выше separators — тот зовёт sbMkToggle в preview,
     который вычисляется при регистрации, а не при рендере. -->
<script src="js/components/checkbox.js"></script>
<script src="js/components/toggles.js"></script>
<!-- action-bar — кнопки .sb-btn (CSS из buttons), sbIcon из core. -->
<script src="js/components/action-bar.js"></script>
<!-- popover — примитив якорного позиционирования. Грузится РАНО и намеренно:
     его зовут потребители, стоящие в начале списка (table, section-header), а
     ReferenceError при регистрации = Coming Soon на их страницах. Своих
     тяжёлых зависимостей у него нет: демо-секции спрятаны за геттером
     sections и вычисляются при открытии страницы, а не при регистрации. -->
<script src="js/components/popover.js"></script>
<script src="js/components/separators.js"></script>
<script src="js/components/avatar.js"></script>
<script src="js/components/radio.js"></script>
<script src="js/components/counters.js"></script>
<script src="js/components/kbd.js"></script>
<script src="js/components/search-bar.js"></script>
<script src="js/components/input.js"></script>
<script src="js/components/textarea.js"></script>
<script src="js/components/password.js"></script>
<script src="js/components/tags.js"></script>
<script src="js/components/status.js"></script>
<!-- tooltips — demo-триггер юзает .sb-status-dot из status.css → ПОСЛЕ status.js -->
<script src="js/components/tooltips.js"></script>
<!-- info-footer — юзает классы .sb-status-dot / .sb-sep / .sb-sub; esc из core. -->
<script src="js/components/info-footer.js"></script>
<script src="js/components/list.js"></script>
<script src="js/components/context-menu.js"></script>
<!-- Ниже — те, кто собирает выпадающие панели фабриками context-menu
     (sbMkContextCard + sbMkContextCell) прямо на этапе регистрации:
     table (kebab ряда) и selectors (живая выпадашка). Оба строго ПОСЛЕ
     context-menu.js — иначе ReferenceError и Coming Soon. -->
<script src="js/components/table.js"></script>
<script src="js/components/selectors.js"></script>
<!-- section-header — зависит от sbMkContextCell, поэтому ПОСЛЕ context-menu.
     Но должен идти ДО segment-menu / nav-bar, которые юзают sbMkSectionHeader в превью. -->
<script src="js/components/section-header.js"></script>
<script src="js/components/segment-menu.js"></script>
<!-- tabs (building block) — должен идти ДО tab-bar.js, который юзает sbMkTab. -->
<script src="js/components/tabs.js"></script>
<script src="js/components/tab-bar.js"></script>
<script src="js/components/toc.js"></script>
<script src="js/components/breadcrumbs.js"></script>
<!-- pagination: зависит от sb-btn-secondary (buttons.css/.js загружены первыми)
     и sb-tf (input.js загружен в Inputs-блоке выше). -->
<script src="js/components/pagination.js"></script>
<!-- table-footer: использует sbMkPagination в demo-секциях → должен грузиться ПОСЛЕ pagination.js. -->
<script src="js/components/table-footer.js"></script>
<script src="js/components/header-xs.js"></script>
<!-- file-uploader — юзает SB_SVG (badge.js) и sbMkHeaderXS (header-xs.js) → ПОСЛЕ обоих -->
<script src="js/components/file-uploader.js"></script>
<!-- overlay — примитив модальности; демо юзает sbMkUploader → ПОСЛЕ file-uploader,
     и ДО nav-bar (его search-overlay собирается через sbMkOverlay при регистрации) -->
<script src="js/components/overlay.js"></script>
<!-- chips — кнопка-пилюля; реюзается стеком тостов → ДО toast.js -->
<script src="js/components/chips.js"></script>
<!-- toast — demo реюзает sbMkHeaderXS + SB_SVG (badge.js) → ПОСЛЕ header-xs и badge -->
<script src="js/components/toast.js"></script>
<!-- led-panel / sub-nav / tool-bar — ВЫШЕ хедеров. Секции «Composition»
     у Header S и Header M собирают композицию из этих фабрик прямо при
     регистрации; когда они грузились ниже, guard `typeof sbMkToolBar ===
     'function'` молча отдавал пустую строку и демо-композиция пропадала.
     led-panel переиспользует .sb-status-dot (status.js выше), sub-nav юзает
     sbMkSegmentMenu + sbMkLedPanel, tool-bar — sbMkTabBar + sbMkSearch. -->
<script src="js/components/led-panel.js"></script>
<script src="js/components/sub-nav.js"></script>
<script src="js/components/tool-bar.js"></script>
<script src="js/components/header-s.js"></script>
<script src="js/components/header-m.js"></script>
<script src="js/components/header-l.js"></script>
<script src="js/components/nav-bar.js"></script>
<!-- side-navigation — композит: демо/render юзают sbMkHeaderM, sbMkSearch,
     sbMkSubNav, sbMkTabBar → должен грузиться ПОСЛЕ всех них. -->
<script src="js/components/side-navigation.js"></script>
<!-- dialogues — архитектурный стаб (окно поверх Overlay; спека ожидается) -->
<script src="js/components/dialogues.js"></script>
<script src="js/components/getting-started.js"></script>

<script src="js/init.js"></script>

<!-- Inject lang switcher в DS chrome right slot. После init.js потому что
     sbMkLangSwitcher экспортится из nav-bar.js (загружается выше). Switcher
     обёрнут в IIFE — без top-level переменных и DOM-listener'ов. -->
<script>
(function(){
  var right = document.getElementById('dsNavRight');
  if (!right || typeof sbMkLangSwitcher !== 'function') return;
  var tmp = document.createElement('div');
  // Стартуем с языка документации из localStorage (см. js/docs-i18n.js).
  tmp.innerHTML = sbMkLangSwitcher({ selected: (localStorage.getItem('sb-lang') || 'en').toUpperCase() });
  var switcher = tmp.firstElementChild;
  right.insertBefore(switcher, right.firstChild);
})();
</script>

<!-- Theme-кнопка топбара. Разметка — через sbMkButton (фабрика Button), а не
     руками в HTML: иначе это единственная в DS рукописная кнопка. Иконку
     ставит core.js на DOMContentLoaded (и меняет toggleTheme при клике) —
     этот скрипт выполняется раньше события, так что кнопка уже в DOM. -->
<script>
(function(){
  var right = document.getElementById('dsNavRight');
  if (!right || typeof sbMkButton !== 'function') return;
  var tmp = document.createElement('div');
  tmp.innerHTML = sbMkButton({
    icon: document.documentElement.getAttribute('data-theme') === 'dark' ? 'moon-fill' : 'sun-line',
    attrs: ' id="themeBtn" onclick="toggleTheme()" title="Toggle theme"',
  });
  right.appendChild(tmp.firstElementChild);
})();
</script>

<!-- App Info Footer (dogfood: наш Info Footer в подвале DS). Версия берётся из
     бейджа Nav Bar (single source). IIFE — без top-level переменных. -->
<script>
(function(){
  var el = document.getElementById('app-info-footer');
  if (!el || typeof sbMkInfoFooter !== 'function') return;
  var badge = document.querySelector('.sb-nav-bar-badge .sb-badge-status');
  var ver = badge ? badge.textContent.trim() : 'v1.13.1';
  el.innerHTML = sbMkInfoFooter({
    variant: 'long',
    align: 'center',
    slots: [
      { text: 'Spacebridge Design System' },
      { text: 'Version ' + ver },
      { text: '© Copyright 2026 SpaceBridge Inc.' }
    ]
  });
})();
</script>
</body>
</html>
